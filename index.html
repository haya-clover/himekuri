<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f0e7"><title>こころの日めくり</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="日めくり"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#35443b;background:#f4f0e7}*{box-sizing:border-box}body{margin:0}main{max-width:560px;margin:auto;padding:22px 18px 80px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}h1{font-size:18px;letter-spacing:.14em;font-weight:600;margin:0}.sub{color:#7d8a80;font-size:12px}button,select,input,textarea{font:inherit}button{border:0;background:#e5e9df;color:#385344;border-radius:12px;padding:12px 15px;cursor:pointer}button.primary{background:#496e58;color:white}button:disabled{opacity:.5}button.icon{font-size:19px;padding:10px 14px}select,input,textarea{width:100%;border:1px solid #d4dcd2;border-radius:10px;background:#fff;padding:12px;color:#35443b}textarea{min-height:130px;resize:vertical;line-height:1.8}.sheet{background:#fffefb;border-radius:22px;box-shadow:0 8px 30px #53645015;min-height:390px;padding:25px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}.day{font-size:15px;color:#839186;letter-spacing:.15em}.quote{font-family:'Yu Mincho','Hiragino Mincho ProN',serif;white-space:pre-wrap;overflow-wrap:anywhere;font-size:clamp(22px,5vw,29px);line-height:1.85;text-align:center;margin:0}.photo{width:100%;max-height:350px;object-fit:contain;border-radius:12px}.empty{color:#9aa79d;text-align:center;line-height:1.9}.pager{display:flex;justify-content:space-between;align-items:center;margin:18px 0}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.panel{background:#ffffffb8;border-radius:18px;padding:18px;margin-top:24px}.panel h2{font-size:16px;margin:0 0 14px}label{display:block;font-size:13px;margin:14px 0 7px;color:#596c5e}.small{font-size:12px;color:#738177;line-height:1.7}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.hidden{display:none!important}.thumb{max-height:180px;max-width:100%;border-radius:10px;margin-top:10px}footer{font-size:11px;color:#8d998f;text-align:center;margin-top:26px;line-height:1.7}#message{font-size:13px;min-height:20px;color:#496e58;margin-top:10px}.danger{background:#f7e6e1;color:#8c4d43}
</style></head><body><main><header><div><h1 id="appTitle">☘ こころの日めくり</h1><div class="sub" id="appSubtitle">今日の一枚を、たいせつに。</div></div><button id="settingsBtn" aria-label="設定">⚙ 設定</button></header>
<section id="viewer"><div class="sheet"><div class="day" id="dayLabel"></div><img class="photo hidden" id="viewImg" alt="登録された画像"><p class="quote" id="viewText"></p><div class="empty hidden" id="empty">まだ言葉がありません。<br>「この一枚を編集」から登録できます。</div></div><div class="pager"><button class="icon" id="prev" aria-label="前の一枚">‹</button><span id="pageInfo" class="sub"></span><button class="icon" id="next" aria-label="次の一枚">›</button></div><div class="actions"><button id="today">今日に戻る</button><button class="primary" id="editBtn">✎ この一枚を編集</button></div></section>
<section class="panel hidden" id="editor"><h2 id="editHeading">一枚を編集</h2><label for="quote">言葉</label><textarea id="quote" placeholder="ここに好きな言葉を入力"></textarea><label for="photoInput">画像（写真やイラスト）</label><input type="file" accept="image/*" id="photoInput"><img class="thumb hidden" id="editPreview" alt="画像のプレビュー"><div class="row" style="margin-top:12px"><button id="removePhoto">画像を削除</button><button id="cancelEdit">戻る</button></div><div class="row" style="margin-top:12px"><button class="danger" id="clearEntry">この一枚を削除</button><button class="primary" id="saveEntry">保存する</button></div><div id="message" role="status"></div></section>
<section class="panel hidden" id="settings"><h2>設定</h2><label for="titleInput">アプリのタイトル</label><input id="titleInput" type="text" maxlength="40" placeholder="こころの日めくり"><label for="subtitleInput">サブタイトル</label><input id="subtitleInput" type="text" maxlength="80" placeholder="今日の一枚を、たいせつに。"><label for="mode">日めくり方式</label><select id="mode"><option value="weekday">曜日連動（7枚）</option><option value="monthday">日付連動（31枚）</option><option value="cycle">自由循環</option></select><div id="cycleSettings" class="hidden"><label for="count">登録枚数（1〜366枚）</label><input id="count" type="number" min="1" max="366" value="10"><label for="start">循環の基準日（この日を1枚目にする）</label><input id="start" type="date"></div><button class="primary" id="saveSettings" style="margin-top:15px;width:100%">設定を保存</button><h2 style="margin-top:30px">バックアップ</h2><p class="small">言葉・画像・設定をJSONファイルに書き出せます。端末のデータが消える場合に備え、時々保存してください。</p><button id="export">バックアップを書き出す</button><label for="import">バックアップを復元（現在の登録内容は置き換わります）</label><input type="file" id="import" accept="application/json,.json"><div class="row" style="margin-top:20px"><button id="closeSettings">閉じる</button></div><div id="settingsMsg" role="status" class="small"></div></section>
<footer>登録したデータは、このブラウザ内に保存されます。<br>別の端末には自動同期されません。</footer></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const key='kokoro-himekuri-v1';const todayDate=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};let state={title:'こころの日めくり',subtitle:'今日の一枚を、たいせつに。',mode:'monthday',count:10,start:iso(todayDate()),entries:{}};try{const raw=localStorage.getItem(key);if(raw){const s=JSON.parse(raw);if(s&&['weekday','monthday','cycle'].includes(s.mode)&&s.entries&&typeof s.entries==='object')state={...state,...s}}}catch(e){alert('保存データを読み込めませんでした。バックアップから復元してください。')};let offset=0,editImage=null;const days=()=>state.mode==='weekday'?7:state.mode==='monthday'?31:Math.max(1,Math.min(366,Number(state.count)||10));const atOffset=o=>{const d=todayDate();d.setDate(d.getDate()+o);return d};const indexFor=d=>{if(state.mode==='weekday')return (d.getDay()+6)%7+1;if(state.mode==='monthday')return d.getDate();const start=parse(state.start);const diff=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(start.getFullYear(),start.getMonth(),start.getDate()))/86400000);return ((diff%days())+days())%days()+1};const currentIndex=()=>indexFor(atOffset(offset));const entry=()=>state.entries[String(currentIndex())]||{};const show=id=>{for(const el of ['viewer','editor','settings'])$(el).classList.toggle('hidden',el!==id)};function render(){const title=(typeof state.title==='string'&&state.title.trim())?state.title.trim():'こころの日めくり';$('appTitle').textContent='☘ '+title;$('appSubtitle').textContent=typeof state.subtitle==='string'?state.subtitle:'今日の一枚を、たいせつに。';document.title=title;const d=atOffset(offset),idx=currentIndex(),e=entry();$('dayLabel').textContent=state.mode==='weekday'?['月曜日','火曜日','水曜日','木曜日','金曜日','土曜日','日曜日'][idx-1]:state.mode==='monthday'?`${idx}日`:`${idx}枚目`;$('pageInfo').textContent=`${d.getMonth()+1}月${d.getDate()}日 ・ ${idx} / ${days()}`;$('viewText').textContent=e.text||'';$('viewText').classList.toggle('hidden',!e.text);$('viewImg').classList.toggle('hidden',!e.image);if(e.image)$('viewImg').src=e.image;else $('viewImg').removeAttribute('src');$('empty').classList.toggle('hidden',!!(e.text||e.image))}function persist(){try{localStorage.setItem(key,JSON.stringify(state));return true}catch(e){alert('保存容量が不足しています。画像を小さくするか、バックアップ後に登録内容を整理してください。');return false}}function edit(){const e=entry();editImage=e.image||null;$('quote').value=e.text||'';$('editHeading').textContent=`${currentIndex()}枚目を編集`;$('photoInput').value='';preview();$('message').textContent='';show('editor')}function preview(){$('editPreview').classList.toggle('hidden',!editImage);if(editImage)$('editPreview').src=editImage;else $('editPreview').removeAttribute('src')}function compress(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('画像を読み込めません'));img.onload=()=>{const scale=Math.min(1,1200/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};img.src=reader.result};reader.readAsDataURL(file)})}function settings(){show('settings');$('titleInput').value=state.title||'こころの日めくり';$('subtitleInput').value=typeof state.subtitle==='string'?state.subtitle:'今日の一枚を、たいせつに。';$('mode').value=state.mode;$('count').value=state.count;$('start').value=state.start;toggleCycle();$('settingsMsg').textContent=''}function toggleCycle(){$('cycleSettings').classList.toggle('hidden',$('mode').value!=='cycle')}
$('prev').onclick=()=>{offset--;render()};$('next').onclick=()=>{offset++;render()};$('today').onclick=()=>{offset=0;render()};$('editBtn').onclick=edit;$('cancelEdit').onclick=()=>{show('viewer');render()};$('settingsBtn').onclick=settings;$('closeSettings').onclick=()=>{show('viewer');render()};$('mode').onchange=toggleCycle;$('photoInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('画像ファイルを選んでください');return}try{editImage=await compress(f);preview();$('message').textContent='画像を読み込みました'}catch(err){alert('この画像は読み込めませんでした。JPEGやPNGをお試しください。')}};$('removePhoto').onclick=()=>{editImage=null;preview();$('photoInput').value=''};$('saveEntry').onclick=()=>{const i=String(currentIndex());const previous=state.entries[i];const text=$('quote').value.trim();if(text||editImage)state.entries[i]={text,image:editImage};else delete state.entries[i];if(!persist()){if(previous)state.entries[i]=previous;else delete state.entries[i];return}show('viewer');render()};$('clearEntry').onclick=()=>{if(!confirm('この一枚の言葉と画像を削除しますか？'))return;delete state.entries[String(currentIndex())];persist();show('viewer');render()};$('saveSettings').onclick=()=>{const mode=$('mode').value;const count=Number($('count').value);const start=$('start').value;if(mode==='cycle'&&(!Number.isInteger(count)||count<1||count>366||!/^\d{4}-\d{2}-\d{2}$/.test(start)||Number.isNaN(parse(start).getTime()))){$('settingsMsg').textContent='枚数（1〜366）と基準日を正しく入力してください';return}state.title=$('titleInput').value.trim().slice(0,40)||'こころの日めくり';state.subtitle=$('subtitleInput').value.trim().slice(0,80);state.mode=mode;if(mode==='cycle'){state.count=count;state.start=start}if(!persist())return;offset=0;show('viewer');render()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'kokoro-himekuri',version:1,...state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`himekuri-backup-${iso(todayDate())}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const s=JSON.parse(await f.text());if(s.app!=='kokoro-himekuri'||!['weekday','monthday','cycle'].includes(s.mode)||!s.entries||typeof s.entries!=='object'||Array.isArray(s.entries)||!Number.isInteger(Number(s.count))||Number(s.count)<1||Number(s.count)>366||typeof s.start!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s.start))throw Error('形式が違います');if(!confirm('現在の登録内容をバックアップの内容に置き換えますか？'))return;const old=state;state={title:typeof s.title==='string'?s.title.slice(0,40):'こころの日めくり',subtitle:typeof s.subtitle==='string'?s.subtitle.slice(0,80):'今日の一枚を、たいせつに。',mode:s.mode,count:Number(s.count),start:s.start,entries:s.entries};if(!persist()){state=old;return}offset=0;settings();$('settingsMsg').textContent='復元しました';render()}catch(err){$('settingsMsg').textContent='バックアップを読み込めませんでした。正しいファイルか確認してください'}finally{e.target.value=''}};render()})();
</script><script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script></body></html>
